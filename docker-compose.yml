version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tienda-postgres
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda123
      POSTGRES_DB: tienda_cuba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tienda-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Opcional: backend en Docker
  # backend:
  #   build: ./backend
  #   ports:
  #     - "3000:3000"
  #   env_file: ./backend/.env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
  minio_data:
