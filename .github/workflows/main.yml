name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter app
        run: flutter create --org com.tiendacuba --project-name tienda_cuba app

      - name: Install store code
        run: |
          if [ -f store_main.dart ]; then
            cp store_main.dart app/lib/main.dart
          elif [ -f main.dart ]; then
            cp main.dart app/lib/main.dart
          else
            echo "Falta store_main.dart"
            exit 1
          fi

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tienda-cuba-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
