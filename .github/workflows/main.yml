name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create modern store app
        run: |
          flutter create --org com.tiendacuba --project-name tienda_cuba app
          cat > app/lib/main.dart << 'DART_EOF'
import 'package:flutter/material.dart';
import 'package:flutter/services.dart';

void main() {
  runApp(const TiendaCubaApp());
}

class TiendaCubaApp extends StatelessWidget {
  const TiendaCubaApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Tienda Cuba',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(
        colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF0A84FF), brightness: Brightness.light),
        useMaterial3: true,
        fontFamily: 'Roboto',
        scaffoldBackgroundColor: const Color(0xFFF5F7FA),
      ),
      home: const StoreHome(),
    );
  }
}

class Product {
  final String id, name, category, description;
  final double priceCUP, priceMLC;
  final Color color;
  final IconData icon;
  Product({required this.id, required this.name, required this.category, required this.description, required this.priceCUP, required this.priceMLC, required this.color, required this.icon});
}

