name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter app
        run: flutter create --org com.tiendacuba --project-name tienda_cuba app

      - name: Install store code, icon and dependencies
        run: |
          if [ -f store_main.dart ]; then
            cp store_main.dart app/lib/main.dart
            echo "store_main.dart copiado"
          elif [ -f main.dart ]; then
            cp main.dart app/lib/main.dart
            echo "main.dart copiado"
          else
            echo "ERROR: falta store_main.dart"
            ls -la
            exit 1
          fi

          # Icono de la app (app_icon.png en la raiz del repo)
          if [ -f app_icon.png ]; then
            mkdir -p app/android/app/src/main/res/mipmap-xxxhdpi
            mkdir -p app/android/app/src/main/res/mipmap-xxhdpi
            mkdir -p app/android/app/src/main/res/mipmap-xhdpi
            mkdir -p app/android/app/src/main/res/mipmap-hdpi
            mkdir -p app/android/app/src/main/res/mipmap-mdpi
            cp app_icon.png app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp app_icon.png app/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp app_icon.png app/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp app_icon.png app/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp app_icon.png app/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            # Adaptive icon foreground (Android 8+)
            mkdir -p app/android/app/src/main/res/mipmap-anydpi-v26
            echo "Icono instalado"
          else
            echo "AVISO: no hay app_icon.png, se usara el icono por defecto"
            ls -la
          fi

          cd app
          if ! grep -q shared_preferences pubspec.yaml; then
            sed -i '/cupertino_icons:/a\  shared_preferences: ^2.2.2' pubspec.yaml
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with
