name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter app
        run: flutter create --org com.tiendacuba --project-name tienda_cuba app

      - name: Install store code, icon and dependencies
        run: |
          if [ -f store_main.dart ]; then
            cp store_main.dart app/lib/main.dart
          elif [ -f main.dart ]; then
            cp main.dart app/lib/main.dart
          else
            echo "ERROR: falta store_main.dart"
            exit 1
          fi

          ICON=""
          for f in app_icon.png app_icon.jpg app_icon.jpeg icon.png icon.jpg; do
            if [ -f "$f" ]; then ICON="$f"; break; fi
          done
          if [ -n "$ICON" ]; then
            mkdir -p app/android/app/src/main/res/mipmap-xxxhdpi
            mkdir -p app/android/app/src/main/res/mipmap-xxhdpi
            mkdir -p app/android/app/src/main/res/mipmap-xhdpi
            mkdir -p app/android/app/src/main/res/mipmap-hdpi
            mkdir -p app/android/app/src/main/res/mipmap-mdpi
            cp "$ICON" app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp "$ICON" app/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON" app/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON" app/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON" app/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            echo "Icono instalado desde $ICON"
          else
            echo "AVISO: no se encontro icono"
            ls -la
          fi

          cd app
          if ! grep -q shared_preferences pubspec.yaml; then
            sed -i '/cupertino_icons:/a\  shared_preferences: ^2.2.2' pubspec.yaml
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tienda-cuba-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
