class CartItem {
  final Product product;
  int qty;
  CartItem(this.product, [this.qty = 1]);
}

class StoreHome extends StatefulWidget {
  const StoreHome({super.key});
  @override
  State<StoreHome> createState() => _StoreHomeState();
}

class _StoreHomeState extends State<StoreHome> {
  final List<CartItem> cart = [];
  String selectedCategory = 'Todos';
  int tab = 0;

  List<String> get categories => ['Todos', ...{for (final p in demoProducts) p.category}];

  List<Product> get filtered => selectedCategory == 'Todos'
      ? demoProducts
      : demoProducts.where((p) => p.category == selectedCategory).toList();

  int get cartCount => cart.fold(0, (s, i) => s + i.qty);
  double get cartTotal => cart.fold(0.0, (s, i) => s + i.product.priceCUP * i.qty);

  void addToCart(Product p) {
    setState(() {
      final existing = cart.where((c) => c.product.id == p.id);
      if (existing.isNotEmpty) {
        existing.first.qty++;
      } else {
        cart.add(CartItem(p));
      }
    });
    ScaffoldMessenger.of(context).showSnackBar(SnackBar(
      content: Text('${p.name} añadido al carrito'),
      duration: const Duration(seconds: 1),
      behavior: SnackBarBehavior.floating,
    ));
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: IndexedStack(
        index: tab,
        children: [
          _buildHome(),
          _buildCart(),
          _buildProfile(),
        ],
      ),
      bottomNavigationBar: NavigationBar(
        selectedIndex: tab,
        onDestinationSelected: (i) => setState(() => tab = i),
        destinations: [
          const NavigationDestination(icon: Icon(Icons.storefront_outlined), selectedIcon: Icon(Icons.storefront), label: 'Tienda'),
          NavigationDestination(
            icon: Badge(isLabelVisible: cartCount > 0, label: Text('$cartCount'), child: const Icon(Icons.shopping_cart_outlined)),
            selectedIcon: Badge(isLabelVisible: cartCount > 0, label: Text('$cartCount'), child: const Icon(Icons.shopping_cart)),
            label: 'Carrito',
          ),
          const NavigationDestination(icon: Icon(Icons.person_outline), selectedIcon: Icon(Icons.person), label: 'Cuenta'),
        ],
      ),
    );
  }

